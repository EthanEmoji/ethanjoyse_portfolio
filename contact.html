    <main class="container">
        <section>
            <p class="eyebrow">Let's connect</p>
            <h1>Contact Me</h1>
            <p>If you would like to connect with me, you can reach out directly using my details below or send a message through the form.</p>
<!-- Empty container box styled by .contact-box -->
<div id="contact-box" class="contact-box"></div>

<script>
  const CONFIG = {
    contact: {
      email: "ethanjoyse1234@gmail.com",
      phone: "+91 8590461907",
      addressLines: [
        "Vimala Sadanam",
        "Mulavana P.O, Perayam",
        "Near NSS HS, Kollam",
        "Kerala, India - 691503"
      ]
    }
  };

  // Injects the CONFIG details into the box above
  const box = document.getElementById("contact-box");
  box.innerHTML = `
    <h3>Direct Contact Information</h3>
    <p><strong>Email:</strong> <a href="mailto:${CONFIG.contact.email}">${CONFIG.contact.email}</a></p>
    <p><strong>Phone:</strong> <a href="tel:${CONFIG.contact.phone.replace(/\s+/g, '')}">${CONFIG.contact.phone}</a></p>
    <address>
      <strong>Address:</strong><br>
      ${CONFIG.contact.addressLines.join("<br>")}
    </address>
  `;
</script>

            <!-- Updated mailto link to use your actual email -->
            <form class="contact-form" action="mailto:ethanjoyse1234@gmail.com" method="post" enctype="text/plain">
                <label for="name">Your Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name" required>

                <label for="email">Your Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
